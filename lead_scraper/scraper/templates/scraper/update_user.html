{% extends "scraper/base.html" %}

{% block content %}
<style>
    .update-user-container {
        max-width: 500px;
        margin: 40px auto;
        padding: 30px;
        background-color: #f9f9f9;
        border-radius: 12px;
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .update-user-container h2 {
        text-align: center;
        margin-bottom: 25px;
        color: #030f27;
    }

    .form-group {
        margin-bottom: 20px;
    }

    .form-group label {
        display: block;
        font-weight: 600;
        margin-bottom: 8px;
        color: #333;
    }

    .form-group input,
    .form-group select {
        width: 100%;
        padding: 10px 12px;
        font-size: 16px;
        border-radius: 6px;
        border: 1px solid #ccc;
        transition: border-color 0.3s;
    }

    .form-group input:focus,
    .form-group select:focus {
        border-color: #030f27;
        outline: none;
    }

    .btn-submit {
        background-color: #030f27;
        color: white;
        border: none;
        padding: 12px 18px;
        border-radius: 6px;
        font-size: 16px;
        cursor: pointer;
        width: 100%;
        transition: background-color 0.3s;
    }

    .btn-submit:hover {
        background-color: #051a47;
    }
</style>

<div class="update-user-container">
    <h2>Update User: {{ user_obj.username }}</h2>
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label for="id_first_name">First Name</label>
            {{ form.first_name }}
        </div>
        <div class="form-group">
            <label for="id_last_name">Last Name</label>
            {{ form.last_name }}
        </div>
        <div class="form-group">
            <label for="id_email">Email</label>
            {{ form.email }}
        </div>
        <div class="form-group">
            <label for="id_is_active">Active</label>
            {{ form.is_active }}
        </div>
        <button type="submit" class="btn-submit">Update</button>
    </form>
</div>
{% endblock %}
