<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leads List</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            background-color: #f8f9fa;
        }

        /* Sidebar styles */
        .sidebar {
            height: 100vh;
            width: 200px; /* Reduced size */
            background-color: #030f27;
            padding-top: 30px;
            position: fixed;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .sidebar h2 {
            color: white;
            font-size: 18px;
            margin-bottom: 25px;
            text-align: center;
        }

        .sidebar form {
            margin-bottom: 15px;
            width: 90%;
        }

        .sidebar button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            font-size: 14px;
            border-radius: 5px;
            transition: background-color 0.3s;
        }

        .sidebar button:hover {
            background-color: #0056b3;
        }

        /* Main content */
        .content {
            margin-left: 210px; /* Adjusted margin to fit new sidebar */
            padding: 40px;
            flex-grow: 1;
            text-align: center;
        }

        h1 {
            margin-bottom: 30px;
            color: #030f27;
        }

        table {
            width: 90%;
            margin: 0 auto;
            border-collapse: collapse;
            background-color: white;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.05);
            border-radius: 8px;
            overflow: hidden;
        }

        th, td {
            padding: 14px 16px;
            text-align: left;
            border-bottom: 1px solid #dee2e6;
        }

        th {
            background-color: #f1f1f1;
            font-weight: 600;
        }

        tr:hover {
            background-color: #f8f9fa;
        }

        a {
            color: #007bff;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                height: auto;
                position: relative;
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: center;
                gap: 10px;
                padding: 10px 0;
            }

            .content {
                margin-left: 0;
                padding: 20px;
            }

            table {
                width: 100%;
            }

            .sidebar h2 {
                display: none;
            }
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <h2>Lead Actions</h2>

        <form method="POST">
            {% csrf_token %}
            <button type="submit">Scrape Leads</button>
        </form>

        <form method="get" action="{% url 'export_today_leads' %}">
            <button type="submit">Export Leads</button>
        </form>

        <form method="get" action="{% url 'add_course' %}">
            <button type="submit">Add Course</button>
        </form>
    </div>

    <!-- Main Content -->
    <div class="content">
        <h1>Scraped Leads</h1>
        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>Lead Name</th>
                    <th>Profile Link</th>
                    <th>Source</th>
                    <th>Email</th>
                </tr>
            </thead>
            <tbody>
                {% for lead in leads %}
                    <tr>
                        <td>{{ forloop.counter }}</td>
                        <td>{{ lead.name }}</td>
                        <td><a href="{{ lead.profile_link }}" target="_blank">{{ lead.profile_link }}</a></td>
                        <td>{{ lead.source }}</td>
                        <td>{{ lead.email }}</td>
                    </tr>
                {% empty %}
                    <tr>
                        <td colspan="5">No leads found.</td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

</body>
</html>
