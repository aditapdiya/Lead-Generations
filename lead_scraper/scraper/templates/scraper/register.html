<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register | Leads Management System</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            overflow: hidden;
        }

        .split-left {
            flex: 1;
            background: linear-gradient(to bottom right, #667eea, #764ba2);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 60px;
            text-align: center;
        }

        .split-left h1 {
            font-size: 3rem;
            line-height: 1.3;
            max-width: 80%;
        }

        .split-right {
            flex: 1;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }

        .form-container {
            background: #fff;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 420px;
        }

        .form-container h2 {
            font-size: 24px;
            margin-bottom: 25px;
            color: #333;
            text-align: center;
        }

        form {
            display: flex;
            flex-direction: column;
        }

        form input {
            padding: 12px 14px;
            font-size: 15px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 10px;
            transition: 0.3s;
        }

        form input:focus {
            border-color: #667eea;
            outline: none;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
        }

        button {
            background-color: #667eea;
            color: white;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background-color: #5a67d8;
            transform: scale(1.02);
        }

        .bottom-link {
            margin-top: 18px;
            text-align: center;
            font-size: 14px;
        }

        .bottom-link a {
            color: #667eea;
            font-weight: 600;
            text-decoration: none;
        }

        .bottom-link a:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            html, body {
                flex-direction: column;
            }

            .split-left, .split-right {
                width: 100%;
                height: 50%;
            }

            .split-left h1 {
                font-size: 28px;
            }

            .form-container {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>

<div class="split-left">
    <h1>Welcome to<br>Leads Management<br><strong>TechVista Code</strong></h1>
</div>

<div class="split-right">
    <div class="form-container">
        <h2>Create Your Account</h2>
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}

            <button type="submit">Register</button>
        </form>

        <div class="bottom-link">
            Already have an account? <a href="{% url 'login' %}">Login here</a>
        </div>
    </div>
</div>

</body>
</html>
